# Build, test, and format zig-libsql (Linux primary).
name: CI

on:
  push:
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "graphite-base/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  ZIG_VERSION: "0.16.0"

jobs:

  optimize_ci:
    uses: ./.github/workflows/graphite-ci-optimizer.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  fmt:
    needs: optimize_ci
    # Fail-open: run unless the optimizer explicitly said skip=true; !cancelled() keeps
    # CI running when optimize_ci errors or its skip output is empty.
    if: ${{ !cancelled() && needs.optimize_ci.outputs.skip != 'true' }}
    name: zig fmt --check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Format check
        run: |
          set -euo pipefail
          zig fmt --check src build.zig build.zig.zon

  build-test:
    needs: optimize_ci
    # Fail-open: run unless the optimizer explicitly said skip=true; !cancelled() keeps
    # CI running when optimize_ci errors or its skip output is empty.
    if: ${{ !cancelled() && needs.optimize_ci.outputs.skip != 'true' }}
    name: zig build && zig build test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Verify vendor amalgamation pin
        run: |
          set -euo pipefail
          # Integrity gate: vendor/VERSION sha256 must match on-disk amalgamation.
          c_hash="$(sha256sum vendor/sqlite3.c | awk '{print $1}')"
          h_hash="$(sha256sum vendor/sqlite3.h | awk '{print $1}')"
          grep -E "sqlite3\\.c[[:space:]]+sha256:${c_hash}" vendor/VERSION
          grep -E "sqlite3\\.h[[:space:]]+sha256:${h_hash}" vendor/VERSION
          echo "ok: vendor pin matches sqlite3.c / sqlite3.h"

      - name: Build
        run: |
          set -euo pipefail
          zig build
          test -x zig-out/bin/zig_libsql

      - name: Test
        run: |
          set -euo pipefail
          zig build test

      - name: No system sqlite3 in link line (sanity)
        run: |
          set -euo pipefail
          # Default product path must not depend on host libsqlite3.
          if ldd zig-out/bin/zig_libsql 2>/dev/null | grep -E 'libsqlite3\.so'; then
            echo "error: zig_libsql linked system libsqlite3" >&2
            exit 1
          fi
          echo "ok: no system libsqlite3 in dynamic deps"

  consumer-smoke:
    needs: optimize_ci
    # Fail-open: run unless the optimizer explicitly said skip=true; !cancelled() keeps
    # CI running when optimize_ci errors or its skip output is empty.
    if: ${{ !cancelled() && needs.optimize_ci.outputs.skip != 'true' }}
    name: zig fetch path-dep consumer smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          zig-version: ${{ env.ZIG_VERSION }}

      - name: Consumer project builds against this tree
        run: |
          set -euo pipefail
          # Relative path dep (Zig rejects absolute path deps). Sibling of package root.
          SMOKE="${GITHUB_WORKSPACE}/../zig-libsql-consumer-smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE/src"
          cat > "$SMOKE/build.zig.zon" <<'EOF'
          .{
              .name = .libsql_smoke,
              .version = "0.0.0",
              .fingerprint = 0x3f7877dc3ffed3d5,
              .minimum_zig_version = "0.16.0",
              .dependencies = .{
                  .zig_libsql = .{ .path = "../zig-libsql" },
              },
              .paths = .{ "build.zig", "build.zig.zon", "src" },
          }
          EOF
          sed -i 's/^[[:space:]]*//' "$SMOKE/build.zig.zon"
          # GITHUB_WORKSPACE is .../zig-libsql; sibling path ../zig-libsql may not resolve
          # if the checkout directory name differs. Point path at the basename of workspace.
          PKG_BASENAME="$(basename "${GITHUB_WORKSPACE}")"
          sed -i "s|../zig-libsql|../${PKG_BASENAME}|" "$SMOKE/build.zig.zon"
          cat > "$SMOKE/build.zig" <<'EOF'
          const std = @import("std");
          pub fn build(b: *std.Build) void {
              const target = b.standardTargetOptions(.{});
              const optimize = b.standardOptimizeOption(.{});
              const libsql = b.dependency("zig_libsql", .{
                  .target = target,
                  .optimize = optimize,
              });
              const root = b.createModule(.{
                  .root_source_file = b.path("src/main.zig"),
                  .target = target,
                  .optimize = optimize,
                  .imports = &.{
                      .{ .name = "zig_libsql", .module = libsql.module("zig_libsql") },
                  },
              });
              const exe = b.addExecutable(.{ .name = "ls", .root_module = root });
              b.installArtifact(exe);
          }
          EOF
          sed -i 's/^[[:space:]]*//' "$SMOKE/build.zig"
          cat > "$SMOKE/src/main.zig" <<'EOF'
          const std = @import("std");
          const libsql = @import("zig_libsql");
          pub fn main() !void {
              const a = std.heap.page_allocator;
              var db = try libsql.Database.open(a, .{ .path = ":memory:" });
              defer db.deinit();
              var conn = db.connect();
              try conn.exec("select 1;", .{});
              std.debug.print("zig-libsql {s} engine {s}\n", .{ libsql.version, libsql.engineVersion() });
          }
          EOF
          sed -i 's/^[[:space:]]*//' "$SMOKE/src/main.zig"
          cd "$SMOKE"
          zig build
          # The consumer prints its banner via std.debug.print (stderr), so fold
          # stderr into the pipe; grepping stdout alone matches nothing under pipefail.
          ./zig-out/bin/ls 2>&1 | grep -F "zig-libsql"
          rm -rf "$SMOKE"
